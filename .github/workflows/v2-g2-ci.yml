name: V2 G2 CI

on:
  push:
    branches:
      - impl/v2-g2-protocol-freeze
      - freeze/v2-g2-implementation
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Full repository suite
        run: pytest -q
      - name: G2 module compile without repository bytecode
        run: |
          python - <<'PY'
          import py_compile
          import tempfile
          from pathlib import Path

          sources = [
              Path('src/arc_mkii/v2_g2_protocol.py'),
              Path('src/arc_mkii/v2_g2_cli.py'),
          ]
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              for source in sources:
                  py_compile.compile(
                      str(source),
                      cfile=str(root / f'{source.name}c'),
                      doraise=True,
                  )
          PY
      - name: Clean working tree
        run: test -z "$(git status --porcelain)"
