name: V2 G1 CI

on:
  push:
    branches:
      - impl/v2-g1-six-query-census
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Full suite
        run: python -m pytest -q
      - name: V2 G1 V0 semantic regression when present
        run: |
          if [ -f scripts/v2_g1_v0_semantic_regression.py ]; then
            python scripts/v2_g1_v0_semantic_regression.py
          fi
      - name: Diagnose pre-census repository cleanliness
        run: |
          echo '--- git status --short ---'
          git status --short
          echo '--- end status ---'
          test -z "$(git status --short)"
