name: G0.5 Preflight

on:
  push:
    branches:
      - fix/v2-preflight-hardening
      - freeze/v2-preflight-base
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Full legacy suite
        run: python -m pytest -q
      - name: G0.5 semantic equivalence
        run: python scripts/g05_semantic_equivalence.py
