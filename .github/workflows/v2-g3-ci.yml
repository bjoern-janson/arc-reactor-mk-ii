name: V2 G3 CI

on:
  push:
    branches:
      - impl/v2-g3-execution-freeze
      - freeze/v2-g3-implementation
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Full repository suite
        run: pytest -q
      - name: Frozen scientific primitive and G2 protocol diff gate
        run: |
          git diff --exit-code 5689645287c41a71e109f1b022529e8b98f2006d HEAD -- \
            src/arc_mkii/features.py \
            src/arc_mkii/selector.py \
            src/arc_mkii/fit.py \
            src/arc_mkii/artifact.py \
            src/arc_mkii/host.py \
            src/arc_mkii/scramble.py \
            src/arc_mkii/evaluate.py \
            src/arc_mkii/planner.py \
            src/arc_mkii/v2_g2_protocol.py \
            experiments/v2/protocol
      - name: Verify dormant G4 custody topology without importing result path
        run: python -m arc_mkii.v2_g3_cli verify --protocol experiments/v2/protocol --repo-root . > /tmp/v2-g3-verification.json
      - name: G3 and dormant G4 module compile without repository bytecode
        run: |
          python - <<'PY'
          import py_compile
          import tempfile
          from pathlib import Path

          sources = [
              Path('src/arc_mkii/v2_g3_execution.py'),
              Path('src/arc_mkii/v2_g3_topology.py'),
              Path('src/arc_mkii/v2_g3_cli.py'),
              Path('src/arc_mkii/v2_g4_execution.py'),
              Path('src/arc_mkii/v2_g4_cli.py'),
          ]
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              for source in sources:
                  py_compile.compile(
                      str(source),
                      cfile=str(root / f'{source.name}c'),
                      doraise=True,
                  )
          PY
      - name: Clean working tree
        run: test -z "$(git status --porcelain)"
